name: native wheels

on:
  push:
    branches:
      - main
      - codex/breeze-portable-cache
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: deterministic package tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest build
      - run: python -m pytest -q tests

  linux:
    name: Linux x64 native wheel
    runs-on: ubuntu-22.04
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build and Vulkan development tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build libvulkan-dev xz-utils
          python -m pip install --upgrade pip build pytest auditwheel "patchelf>=0.17,<1"
      - name: Install and verify pinned Linux Vulkan SDK
        run: |
          python tools/install_vulkan_sdk.py --platform linux --output-root "$RUNNER_TEMP/vulkan-sdk"
          sdk=$(cat "$RUNNER_TEMP/vulkan-sdk/sdk-dir.txt")
          test -x "$sdk/bin/glslc"
          "$sdk/bin/glslc" --version
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - name: Build pinned native worker and wheel
        run: |
          python build_native.py --platform linux_x86_64 --generator Ninja \
            --work-dir "$RUNNER_TEMP/realtimetts-breeze-native" \
            --wheelhouse "$RUNNER_TEMP/realtimetts-breeze-native/wheels"
      - name: Audit and repair Linux wheel
        run: |
          wheel=$(find "$RUNNER_TEMP/realtimetts-breeze-native/wheels" -name '*linux_x86_64.whl' -print -quit)
          test -n "$wheel"
          mkdir -p dist/repaired
          python -m auditwheel repair --lib-sdir /bin --plat manylinux_2_35_x86_64 "$wheel" -w dist/repaired
          repaired=$(find dist/repaired -name '*.whl' -print -quit)
          test -n "$repaired"
          python tools/finalize_wheel.py "$repaired"
          python -m auditwheel show "$repaired"
          cp "$RUNNER_TEMP/realtimetts-breeze-native/wheels/"*.tar.gz dist/repaired/
      - uses: actions/upload-artifact@v4
        with:
          name: realtimetts-breeze-native-linux-x64
          path: dist/repaired/*

  windows:
    name: Windows x64 native wheel
    runs-on: windows-2022
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install verified portable Windows toolchain
        shell: pwsh
        run: |
          python tools/install_windows_toolchain.py --output-root "$env:RUNNER_TEMP\breeze-toolchain"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = "$env:RUNNER_TEMP/breeze-toolchain/mingw64/bin".Replace('\', '/')
          $sdk = "$env:RUNNER_TEMP/breeze-toolchain/ucrt64".Replace('\', '/')
          "BREEZE_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BREEZE_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$compiler" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$sdk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build pinned native worker and wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build pytest
          python build_native.py --platform win_amd64 --generator Ninja --work-dir "$env:RUNNER_TEMP\realtimetts-breeze-native" --wheelhouse "$env:RUNNER_TEMP\realtimetts-breeze-native\wheels" --cmake-arg="-DCMAKE_C_COMPILER=$env:BREEZE_COMPILER/gcc.exe" --cmake-arg="-DCMAKE_CXX_COMPILER=$env:BREEZE_COMPILER/g++.exe" --cmake-arg="-DCMAKE_MAKE_PROGRAM=$env:BREEZE_COMPILER/ninja.exe" --cmake-arg="-DVulkan_INCLUDE_DIR=$env:BREEZE_SDK/include" --cmake-arg="-DVulkan_LIBRARY=$env:BREEZE_SDK/lib/libvulkan-1.dll.a" --cmake-arg="-DVulkan_GLSLC_EXECUTABLE=$env:BREEZE_SDK/bin/glslc.exe" --cmake-arg="-DVulkan_GLSLANG_VALIDATOR_EXECUTABLE=$env:BREEZE_SDK/bin/glslangValidator.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$env:RUNNER_TEMP\realtimetts-breeze-native\wheels\*" dist\
      - uses: actions/upload-artifact@v4
        with:
          name: realtimetts-breeze-native-windows-x64
          path: dist/*
